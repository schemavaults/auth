# Single-VM deployment of the SchemaVaults auth-server behind an nginx
# reverse proxy. See deploy/README.md for setup instructions.
#
#   nginx                 serves /_next/static/ + public/ assets from disk and
#                         proxies everything else to the auth-server
#   schemavaults-auth     slim `production` image (no .next/static)
#   schemavaults-auth-redis
#
# Postgres is NOT part of this stack: in the `production` app environment the
# server connects to a Neon-compatible serverless Postgres endpoint over
# secure WebSockets (wss://${POSTGRES_HOST}/v2). Point the POSTGRES_* values
# in auth-server.env at your hosted database. See README.md.

name: schemavaults-auth

services:
  nginx:
    image: schemavaults/auth-server-nginx:local
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
      args:
        BUN_VERSION: 1.3.14
        NODEJS_VERSION: 24-alpine
        NGINX_VERSION: 1.29-alpine
      target: nginx
    restart: unless-stopped
    depends_on:
      - schemavaults-auth
    environment:
      # server_name for the generated site config (see
      # deploy/nginx/templates/auth-server.conf.template)
      SERVER_NAME: ${SERVER_NAME:-_}
      AUTH_SERVER_UPSTREAM: schemavaults-auth:80
      CLIENT_MAX_BODY_SIZE: 8m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    # To terminate TLS here instead of in an external proxy/load balancer,
    # publish 443, mount your certificates, and override the site template
    # with a TLS-enabled copy (see the TLS notes inside the template):
    #   ports:
    #     - "443:443"
    #   volumes:
    #     - /etc/letsencrypt:/etc/letsencrypt:ro
    #     - ./nginx/templates/auth-server.conf.template:/etc/nginx/templates/auth-server.conf.template:ro

  schemavaults-auth:
    image: schemavaults/auth-server:production-local
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
      args:
        BUN_VERSION: 1.3.14
        NODEJS_VERSION: 24-alpine
      target: production
    restart: unless-stopped
    depends_on:
      - schemavaults-auth-redis
    # Deployment secrets + configuration; copy auth-server.env.example to
    # auth-server.env (gitignored) and fill it in.
    env_file:
      - ./auth-server.env
    environment:
      SCHEMAVAULTS_APP_ENVIRONMENT: production
      NEXT_PUBLIC_SCHEMAVAULTS_APP_ENVIRONMENT: production
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://schemavaults-auth-redis:6379}
    expose:
      - 80

  schemavaults-auth-redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 6s
      timeout: 4s
      retries: 8

volumes:
  redis-data:
