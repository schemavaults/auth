services:
  schemavaults-e2e-auth-tests:
    container_name: schemavaults-e2e-auth-tests
    build:
      context: ../..
      dockerfile: tests/e2e-auth-tests/Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: test-runner
    depends_on:
      - schemavaults-auth-server
    environment:
      CYPRESS_BASE_URL: http://schemavaults-auth-server:80
    networks:
      - test-enduser-network
    links:
      - schemavaults-auth-server

  schemavaults-auth-server:
    container_name: schemavaults-auth-server
    build:
      context: ../..
      dockerfile: auth-server/Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: production
    depends_on:
      - postgres-db
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DATABASE: schemavaults-auth-server
      POSTGRES_HOST: postgres-db
      PRIVATE_GLOBAL_PASSWORD_SALT: examplePasswordSalt12
      PRIVATE_PASSWORD_HASH_ROUNDS: 5
    networks:
      - test-enduser-network
      - test-database-network
    links:
      - postgres-db

  postgres-db:
    image: postgres:16.8
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DB: schemavaults-auth-server
    networks:
      - test-database-network

volumes:
  postgres-data:

networks:
  test-enduser-network:
    driver: bridge
  test-database-network:
    driver: bridge
