services:
  schemavaults-e2e-auth-tests:
    image: schemavaults/e2e-auth-tests:local
    build:
      context: ../..
      dockerfile: tests/e2e-auth-tests/Dockerfile
      args:
        BUN_VERSION: 1.3.14
      target: test-runner
    depends_on:
      - schemavaults-auth
    volumes:
      - ./cypress/screenshots:/schemavaults/auth/tests/e2e-auth-tests/cypress/screenshots/
      - ./cypress/videos:/schemavaults/auth/tests/e2e-auth-tests/cypress/videos/
    environment:
      CYPRESS_BASE_URL: http://schemavaults-auth:80
      SCHEMAVAULTS_APP_ENVIRONMENT: test
      TEST_SUITE_NAME: ${TEST_SUITE_NAME:?error}
      EXAMPLE_NEXTJS_RESOURCE_SERVER_URL: http://example-nextjs-resource-server
      EXAMPLE_NEXTJS_RESOURCE_SERVER_JWKS_ACCESS_PUBLIC_KEY: ${EXAMPLE_NEXTJS_RESOURCE_SERVER_JWKS_ACCESS_PUBLIC_KEY:-null}
      # White-label values (set by e2e-auth-tests-cli for the white_label
      # suite); must match the schemavaults-auth service's values so helper
      # commands and specs build app-id-scoped URLs, cookie names, and
      # branding assertions against the deployment under test.
      SCHEMAVAULTS_AUTH_SERVER_APP_ID: ${SCHEMAVAULTS_AUTH_SERVER_APP_ID:-schemavaults-auth}
      SCHEMAVAULTS_AUTH_SERVER_FRIENDLY_NAME: ${SCHEMAVAULTS_AUTH_SERVER_FRIENDLY_NAME:-}
      SCHEMAVAULTS_AUTH_SERVER_DESCRIPTION: ${SCHEMAVAULTS_AUTH_SERVER_DESCRIPTION:-}
      SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_1: ${SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_1:-}
      SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_2: ${SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_2:-}
    profiles:
      - e2e
      - e2e_with_resource_server
    command:
      [
        "bun",
        "run",
        "e2e",
        "--spec",
        "./cypress/e2e/${TEST_SUITE_NAME:?error}/**.cy.ts",
      ]

  example-nextjs-resource-server:
    image: schemavaults/example-nextjs-resource-server:local
    build:
      context: ../..
      dockerfile: tests/example-nextjs-resource-server/Dockerfile
      args:
        BUN_VERSION: 1.3.14
        NODEJS_VERSION: 24-alpine
      target: production
    depends_on:
      - schemavaults-auth
    environment:
      SCHEMAVAULTS_APP_ENVIRONMENT: test
      NEXT_PUBLIC_SCHEMAVAULTS_APP_ENVIRONMENT: test
      NODE_ENV: test
      SCHEMAVAULTS_API_SERVER_ID: 00000000-0000-0000-0000-000000000000
      SCHEMAVAULTS_CLIENT_APP_ID: 00000000-0000-0000-0000-000000000000
      SCHEMAVAULTS_AUTH_JWKS_ACCESS_PRIVATE_KEY: ${EXAMPLE_NEXTJS_RESOURCE_SERVER_JWKS_ACCESS_PRIVATE_KEY:-null}
    expose:
      - 80
    ports:
      - 3007:80
    profiles:
      - e2e_with_resource_server

  schemavaults-auth:
    image: schemavaults/auth-server:local
    build:
      context: ../..
      dockerfile: auth-server/Dockerfile
      args:
        BUN_VERSION: 1.3.14
        NODEJS_VERSION: 24-alpine
        NEXT_INCLUDE_PRODUCTION_SOURCE_MAPS: yes
      target: test
    depends_on:
      - postgres-db
      - schemavaults-auth-redis
    environment:
      SCHEMAVAULTS_APP_ENVIRONMENT: test
      NEXT_PUBLIC_SCHEMAVAULTS_APP_ENVIRONMENT: test
      NODE_ENV: test
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DATABASE: schemavaults-auth-server-dev
      POSTGRES_HOST: postgres-db
      REDIS_URL: redis://schemavaults-auth-redis:6379
      PRIVATE_GLOBAL_PASSWORD_SALT: examplePasswordSalt12
      PRIVATE_PASSWORD_HASH_ROUNDS: 5
      PRIVATE_SUPERUSER_INVITE_CODE: superuser
      # Deterministic 32-byte base64 keys so MFA enrolment + verification work
      # in CI. These are throwaway values; never reuse them anywhere outside
      # of the ephemeral test container.
      PRIVATE_MFA_SECRET_KEK: GsQ9z/exSHSgYkJh1+7/Y7h+CKy/u5T5b+tCPGuRu6k=
      PRIVATE_MFA_RECOVERY_PEPPER: nlDsk6vFAVtk7EGAe3HvgLdlZDCc+GX6lb6DD3byfTk=
      NEXT_INCLUDE_PRODUCTION_SOURCE_MAPS: yes
      # White-label overrides (set by e2e-auth-tests-cli for the white_label
      # suite; the defaults keep every other suite on stock branding). All of
      # these are runtime process.env reads on the server -- no rebuild needed.
      SCHEMAVAULTS_AUTH_SERVER_APP_ID: ${SCHEMAVAULTS_AUTH_SERVER_APP_ID:-schemavaults-auth}
      # White-label deployments must set the API server id to the same value
      # as the auth server's own app id.
      SCHEMAVAULTS_API_SERVER_ID: ${SCHEMAVAULTS_AUTH_SERVER_APP_ID:-schemavaults-auth}
      SCHEMAVAULTS_AUTH_SERVER_FRIENDLY_NAME: ${SCHEMAVAULTS_AUTH_SERVER_FRIENDLY_NAME:-}
      SCHEMAVAULTS_AUTH_SERVER_DESCRIPTION: ${SCHEMAVAULTS_AUTH_SERVER_DESCRIPTION:-}
      SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_1: ${SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_1:-}
      SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_2: ${SCHEMAVAULTS_AUTH_SERVER_THEME_COLOR_2:-}
    expose:
      - 80
    ports:
      - 80:80

  schemavaults-auth-redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 6s
      timeout: 4s
      retries: 8

  postgres-db:
    image: schemavaults/postgres-db:local
    build:
      context: ../..
      dockerfile: auth-postgres-db/Dockerfile
      args:
        POSTGRES_VERSION: 17.7
    restart: unless-stopped
    # volumes:    ### We don't want to save data for E2E tests
    #   - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 6s
      timeout: 4s
      retries: 8

  postgres-ws-proxy:
    image: ghcr.io/schemavaults/dbh/postgres-ws-proxy:0.8.7
    platform: linux/amd64
    environment:
      APPEND_PORT: "postgres-db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LISTEN_PORT: ":5433"
      LOG_TRAFFIC: "true"
    ports:
      - "5433:5433"
    depends_on:
      postgres-db:
        condition: service_healthy
