services:
  schemavaults-e2e-auth-tests:
    build:
      context: ../..
      dockerfile: tests/e2e-auth-tests/Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: test-runner
    network_mode: service:schemavaults-auth-server
    depends_on:
      - schemavaults-auth-server
    environment:
      CYPRESS_BASE_URL: http://localhost:80

  schemavaults-auth-server:
    build:
      context: ../..
      dockerfile: auth-server/Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: production
    network_mode: service:postgres-db
    depends_on:
      - postgres-db
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DATABASE: schemavaults-auth-server

  postgres-db:
    image: postgres:16.8
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DB: schemavaults-auth-server

volumes:
  postgres-data:
