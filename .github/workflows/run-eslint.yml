name: Run ESLint

on:
  workflow_call:
    inputs:
      BUN_VERSION:
        description: "What version of Bun should we use?"
        required: true
        type: string

jobs:
  Run-ESLint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
      - name: Run ESLint with Bun
        run: |
          bun run lint
