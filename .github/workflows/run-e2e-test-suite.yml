name: "Run E2E Test Suite"

on:
  workflow_call:
    inputs:
      test-suite-name:
        description: "What is the name of the test suite we are running?"
        required: true
        type: string
      BUN_VERSION:
        description: "What version of Bun should we use?"
        required: true
        type: string
      skip-docker-build:
        description: "Skip Docker image builds and use pre-built images from artifacts"
        required: false
        type: boolean
        default: false
      load-resource-server-image:
        description: "Whether to also load the resource server Docker image"
        required: false
        type: boolean
        default: false

jobs:
  Run-E2E-Test-Suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download core Docker images
        if: ${{ inputs.skip-docker-build }}
        uses: actions/download-artifact@v8
        with:
          name: e2e-docker-images-core
          path: /tmp/docker-images

      - name: Download resource server Docker image
        if: ${{ inputs.skip-docker-build && inputs.load-resource-server-image }}
        uses: actions/download-artifact@v8
        with:
          name: e2e-docker-images-resource-server
          path: /tmp/docker-images

      - name: Load Docker images
        if: ${{ inputs.skip-docker-build }}
        run: |
          for f in /tmp/docker-images/*.tar.gz; do
            echo "Loading $f..."
            docker load < "$f"
          done
          echo "Loaded images:"
          docker images

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.BUN_VERSION }}

      - name: Download e2e-auth-tests-cli.js
        uses: actions/download-artifact@v8
        with:
          name: e2e-auth-tests-cli.js
          path: tests/e2e-auth-tests/dist

      - name: Verify e2e-auth-tests-cli.js was downloaded
        run: |
          CLI_PATH="tests/e2e-auth-tests/dist/e2e-auth-tests-cli.js"
          if [ ! -f "$CLI_PATH" ]; then
            echo "::error::Expected $CLI_PATH to exist and be a file"
            echo "Listing contents of tests/e2e-auth-tests/dist/:"
            ls -laR tests/e2e-auth-tests/dist/ || echo "dist/ directory does not exist"
            exit 1
          fi
          echo "✓ $CLI_PATH exists and is a file"

      - name: Run Tests with Docker Compose
        run: |
          bun run cli e2e ${{ inputs.test-suite-name }}${{ runner.debug == '1' && ' --verbose' || '' }}${{ inputs.skip-docker-build && ' --skip-build' || '' }}
        working-directory: tests/e2e-auth-tests

      - name: Check if screenshots directory exists
        id: check_screenshots_existence
        run: |
          if [ -d "tests/e2e-auth-tests/cypress/screenshots/" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        if: always()

      - name: Upload screenshots of failing tests
        uses: actions/upload-artifact@v6
        with:
          name: failed-${{ inputs.test-suite-name }}-test-screenshots-${{ github.sha }}
          path: tests/e2e-auth-tests/cypress/screenshots/
          retention-days: 1.5
        if: always() && steps.check_screenshots_existence.outputs.exists == 'true'
