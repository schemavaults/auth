name: Publish Package

on:
  workflow_call:
    inputs:
      package_name:
        description: "Name of the package (e.g., @schemavaults/auth-common)"
        required: true
        type: string
      package_path:
        description: "Path to the package directory (e.g., packages/auth-common)"
        required: true
        type: string
      bun_version:
        description: "Bun version to use"
        required: true
        type: string
      node_version:
        description: "NodeJs version to use"
        required: false
        type: string
        default: "24"
    secrets:
      NPM_TOKEN:
        required: true
    outputs:
      published:
        description: "Whether the package was published"
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: "The version that was published (or current version if not published)"
        value: ${{ jobs.publish.outputs.version }}
      package_name:
        description: "The full package name"
        value: ${{ jobs.publish.outputs.package_name }}

jobs:
  BuildSpecifiedPackage:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.check.outputs.local_version }}
      tarball_name: ${{ steps.tarball_name.outputs.tarball_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install dependencies
        run: bun install

      - name: Get package name without scoped @schemavaults/ prefix
        id: tarball_name
        run: |
          echo "tarball_name=$(./scripts/extract-schemavaults-package-name.sh ${{ inputs.package_name }}).tgz" >> $GITHUB_OUTPUT

      - name: Check if publish is needed
        id: check
        run: ./scripts/check-package-version.sh ${{ inputs.package_path }}

      - name: Build package ${{ inputs.package_name }}
        if: steps.check.outputs.needs_publish == 'true'
        run: bun run build --filter ${{ inputs.package_name }}

      - name: Pack up package with Bun
        if: steps.check.outputs.needs_publish == 'true'
        working-directory: ${{ inputs.package_path }}
        run: bun pm pack --quiet --filename ${{ steps.tarball_name.outputs.tarball_name }} --gzip-level 9

      - name: Upload package artifact
        if: steps.check.outputs.needs_publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.tarball_name.outputs.tarball_name }}
          path: ${{ inputs.package_path }}/${{ steps.tarball_name.outputs.tarball_name }}
          retention-days: 1

  Publish-Package-To-Github:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    needs:
      - BuildSpecifiedPackage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.BuildSpecifiedPackage.outputs.tarball_name }}
          path: ${{ inputs.package_path }}/${{ needs.BuildSpecifiedPackage.outputs.tarball_name }}

      - name: Assert tarball exists at expected location
        working-directory: ${{ inputs.package_path }}
        run: |
          if [ ! -f ./${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} ]; then
            echo "Error: ${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} not found!"
            exit 1
          fi

      - name: Publish package to GitHub NPM registry
        working-directory: ${{ inputs.package_path }}
        run: bun publish ./${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} --registry=https://npm.pkg.github.com
        env:
          SCHEMAVAULTS_GITHUB_PACKAGE_REGISTRY_USER: ${{ github.actor }}
          SCHEMAVAULTS_GITHUB_PACKAGE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Publish-Package-To-Npmjs:
    runs-on: ubuntu-latest
    needs:
      - BuildSpecifiedPackage
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: "https://registry.npmjs.org"

      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.BuildSpecifiedPackage.outputs.tarball_name }}
          path: ${{ inputs.package_path }}/${{ needs.BuildSpecifiedPackage.outputs.tarball_name }}

      - name: Assert tarball exists at expected location
        working-directory: ${{ inputs.package_path }}
        run: |
          if [ ! -f ./${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} ]; then
            echo "Error: ${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} not found!"
            exit 1
          fi

      - name: Publish package to NPMJS registry
        working-directory: ${{ inputs.package_path }}
        run: npm publish ./${{ needs.BuildSpecifiedPackage.outputs.tarball_name }} --provenance
