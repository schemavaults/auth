name: Main Branch Production C.I. & C.D.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  BUN_VERSION: 1.3.6

on:
  push:
    branches:
      - main

jobs:
  Run-ESLint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
      - name: Run ESLint with Bun
        run: |
          bun run lint

  Run-Unit-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
      - name: Run unit tests with bun
        run: |
          bun run test

  Run-E2E-Tests:
    runs-on: ubuntu-latest
    needs:
      - Run-Unit-Tests
      - Run-ESLint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests with Docker Compose
        run: |
          /bin/bash ./e2e.sh
        working-directory: tests/e2e-auth-tests
      - name: Check if screenshots directory exists
        id: check_screenshots_existence
        run: |
          if [ -d "tests/e2e-auth-tests/cypress/screenshots/" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        if: always()
      - name: Upload screenshots of failing tests
        uses: actions/upload-artifact@v6
        with:
          name: failed-test-screenshots-${{ github.sha }}
          path: tests/e2e-auth-tests/cypress/screenshots/
          retention-days: 2
        if: always() && steps.check_screenshots_existence.outputs.exists == 'true'

  Deploy-Vercel-Production:
    runs-on: ubuntu-latest
    needs:
      - Run-E2E-Tests
      - Run-Unit-Tests
      - Run-ESLint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Publish packages to npm (in dependency order)
  Publish-App-Definitions:
    needs: Deploy-Vercel-Production
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/app-definitions"
      package_path: packages/app-definitions
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-Auth-Common:
    needs: Publish-App-Definitions
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/auth-common"
      package_path: packages/auth-common
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-JWT:
    needs: Publish-Auth-Common
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/jwt"
      package_path: packages/jwt
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-Auth-Client-SDK:
    needs: Publish-JWT
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/auth-client-sdk"
      package_path: packages/auth-client-sdk
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-Auth-Server-SDK:
    needs: Publish-JWT
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/auth-server-sdk"
      package_path: packages/auth-server-sdk
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-Auth-React-Provider:
    needs: Publish-Auth-Client-SDK
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/auth-react-provider"
      package_path: packages/auth-react-provider
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  Publish-Auth-UI:
    needs: Publish-Auth-React-Provider
    uses: ./.github/workflows/publish-package.yml
    with:
      package_name: "@schemavaults/auth-ui"
      package_path: packages/auth-ui
      bun_version: ${{ env.BUN_VERSION }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
