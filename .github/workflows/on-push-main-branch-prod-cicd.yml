name: Main Branch Production C.I. & C.D.
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  BUN_VERSION: 1.3.3

on:
  push:
    branches:
      - main

jobs:
  Build-Auth-Server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
      - name: Build @schemavaults/auth-server
        run: |
          bun run build:server

  Run-E2E-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Run Tests with Docker Compose
        run: |
          docker compose \
            -f tests/e2e-auth-tests/docker-compose.yml \
            up \
            --exit-code-from schemavaults-e2e-auth-tests \
            --abort-on-container-exit

  Deploy-Vercel-Production:
    runs-on: ubuntu-latest
    needs:
      - Run-E2E-Tests
      - Build-Auth-Server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd=./auth-server
        working-directory: .
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=./auth-server
        working-directory: .
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd=./auth-server
        working-directory: .
