name: Run E2E Tests

on:
  workflow_call:
    inputs:
      BUN_VERSION:
        description: "What version of Bun should we use?"
        required: true
        type: string

jobs:
  Build-Auth-Server-Test-Docker-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build auth server Docker image (test target)
        run: |
          TEST_SUITE_NAME=build docker compose -f tests/e2e-auth-tests/docker-compose.yml build \
            schemavaults-auth

      - name: Save auth server Docker image
        run: |
          docker save schemavaults/auth-server:local \
            | gzip > /tmp/e2e-auth-server-test-image.tar.gz

      - name: Upload auth server image artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-image-auth-server-test
          path: /tmp/e2e-auth-server-test-image.tar.gz
          retention-days: 1

  Build-Postgres-DB-Docker-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build postgres DB Docker image
        run: |
          TEST_SUITE_NAME=build docker compose -f tests/e2e-auth-tests/docker-compose.yml build \
            postgres-db

      - name: Save postgres DB Docker image
        run: |
          docker save schemavaults/postgres-db:local \
            | gzip > /tmp/e2e-postgres-db-image.tar.gz

      - name: Upload postgres DB image artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-docker-image-postgres-db
          path: /tmp/e2e-postgres-db-image.tar.gz
          retention-days: 1

  Build-E2E-Auth-Tests-Docker-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build E2E auth tests Docker image
        run: |
          TEST_SUITE_NAME=build docker compose -f tests/e2e-auth-tests/docker-compose.yml build \
            schemavaults-e2e-auth-tests

      - name: Save E2E auth tests Docker image
        run: |
          docker save schemavaults/e2e-auth-tests:local \
            | gzip > /tmp/e2e-auth-tests-image.tar.gz

      - name: Upload E2E auth tests image artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-docker-image-e2e-auth-tests
          path: /tmp/e2e-auth-tests-image.tar.gz
          retention-days: 1

  Build-Resource-Server-Docker-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build resource server Docker image
        run: |
          TEST_SUITE_NAME=build docker compose -f tests/e2e-auth-tests/docker-compose.yml \
            --profile e2e_with_resource_server \
            build example-nextjs-resource-server

      - name: Save resource server Docker image
        run: |
          docker save \
            schemavaults/example-nextjs-resource-server:local \
            | gzip > /tmp/e2e-resource-server-image.tar.gz

      - name: Upload resource server image artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-docker-images-resource-server
          path: /tmp/e2e-resource-server-image.tar.gz
          retention-days: 1

  Build-E2E-Auth-Tests-CLI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install

      - name: Build CLI
        run: |
          bun run build:cli --filter @schemavaults/e2e-auth-tests

      - name: Upload built CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-auth-tests-cli.js
          path: tests/e2e-auth-tests/dist/e2e-auth-tests-cli.js
          retention-days: 1

  Run-Authentication-Flows-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: authentication_flows
      skip-docker-build: true

  Run-Organizations-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: organizations
      skip-docker-build: true

  Run-Resource-Management-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: resource_management
      skip-docker-build: true

  Run-Superuser-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: superuser
      skip-docker-build: true

  Run-Example-Resource-Server-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
      - Build-Resource-Server-Docker-Image
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: example_resource_server
      skip-docker-build: true
      load-resource-server-image: true

  Run-Miscellaneous-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: misc
      skip-docker-build: true

  Run-Admin-Functionality-E2E-Tests:
    needs:
      - Build-Auth-Server-Test-Docker-Image
      - Build-Postgres-DB-Docker-Image
      - Build-E2E-Auth-Tests-Docker-Image
      - Build-E2E-Auth-Tests-CLI
    uses: ./.github/workflows/run-e2e-test-suite.yml
    with:
      BUN_VERSION: ${{ inputs.BUN_VERSION }}
      test-suite-name: admin
      skip-docker-build: true
