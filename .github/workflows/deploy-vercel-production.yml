name: Deploy to Vercel (Production)

on:
  workflow_call:
    inputs:
      BUN_VERSION:
        description: "Bun version to use"
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        description: "Vercel Token"
        required: true
      VERCEL_PROJECT_ID:
        description: "Vercel Project ID"
        required: true
      VERCEL_ORG_ID:
        description: "Vercel Organization ID"
        required: true

permissions:
  contents: read

jobs:
  Deploy-Vercel-Production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.BUN_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      # /api/test/* routes are gated at runtime by getAppEnvironment() !== 'test',
      # but we want them entirely absent from the production bundle so they cannot
      # be served even if the environment check is ever bypassed.
      - name: Strip /api/test routes from production build
        run: rm -rf auth-server/src/app/api/test
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
