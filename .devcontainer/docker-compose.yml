services:
  auth-server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: development
    network_mode: service:postgres-db
    depends_on:
      - postgres-db
    volumes:
      - .:/workspace:cached
    command: sleep infinity

  postgres-db:
    image: postgres:16.8
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DB: schemavaults-auth-server

volumes:
  postgres-data:
