services:
  auth-server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUN_VERSION: 1.3.3
      target: development
    network_mode: service:postgres-db
    depends_on:
      - postgres-db
    volumes:
      - ../auth-server/public:/schemavaults/auth/auth-server/public
      - ../auth-server/src:/schemavaults/auth/auth-server/src
      - ../packages/app-definitions/src:/schemavaults/auth/packages/app-definitions/src
      - ../packages/auth-client-sdk/src:/schemavaults/auth/packages/auth-client-sdk/src
      - ../packages/auth-common/src:/schemavaults/auth/packages/auth-common/src
      - ../packages/auth-react-provider/src:/schemavaults/auth/packages/auth-react-provider/src
      - ../packages/auth-server-sdk/src:/schemavaults/auth/packages/auth-server-sdk/src
      - ../packages/auth-ui/src:/schemavaults/auth/packages/auth-ui/src
      - ../packages/jwt/src:/schemavaults/auth/packages/jwt/src
    command: "bun run dev --filter @schemavaults/auth-server"

  postgres-db:
    image: postgres:16.8
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: schemavaults-auth-server-dev
      POSTGRES_PASSWORD: schemavaults-auth-server-dev
      POSTGRES_DB: schemavaults-auth-server

volumes:
  postgres-data:
