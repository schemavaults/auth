services:
  postgres-db:
    build:
      context: ..
      dockerfile: auth-postgres-db/Dockerfile
      args:
        POSTGRES_VERSION: 17.7
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    expose:
      - 5432
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 6s
      timeout: 4s
      retries: 8

  postgres-ws-proxy:
    image: ghcr.io/schemavaults/dbh/postgres-ws-proxy:0.8.7
    platform: linux/amd64
    environment:
      APPEND_PORT: "postgres-db:5432"
      ALLOW_ADDR_REGEX: ".*"
      LISTEN_PORT: ":5433"
      LOG_TRAFFIC: "true"
    ports:
      - "5433:5433"
    expose:
      - 5433
    depends_on:
      postgres-db:
        condition: service_healthy
    links:
      - postgres-db
